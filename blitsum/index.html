    const RECORDS = DATASET.records || [];

    function renderKPIs(filtered) {
      const highIntent = filtered.filter(r => r.buyer_intent_score >= 70).length;
      const posts = filtered.filter(r => r.item_type === 'post').length;
      const comments = filtered.filter(r => r.item_type === 'comment').length;
      const kpis = [
        { label: 'Matched Records', val: filtered.length, sub: `of ${RECORDS.length} live extracted items`, color: 'text-white' },
        { label: 'Root Posts vs Nested Comments', val: `${posts} / ${comments}`, sub: 'Parent-child thread linkage preserved', color: 'text-sky-400' },
        { label: 'High Buyer-Intent Leads (70+)', val: highIntent, sub: 'Ready for Blitsum founder outreach', color: 'text-emerald-400' },
        { label: 'Unified Schema Fields', val: '13 Columns', sub: 'Normalized JSON + CSV + Temporal Retry', color: 'text-indigo-300' }
      ];
      document.getElementById('kpiRow').innerHTML = kpis.map(k => `
        <div class="glass rounded-xl p-4">
          <div class="text-xs text-slate-400">${k.label}</div>
          <div class="text-xl font-bold mt-1 mono ${k.color}">${k.val}</div>
          <div class="text-[11px] text-slate-400 mt-1">${k.sub}</div>
        </div>
      `).join('');
    }

    function intentBadge(score) {
      if (score >= 75) return `<span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 mono">🔥 Intent: ${score}/100</span>`;
      if (score >= 50) return `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30 mono">⚡ Intent: ${score}/100</span>`;
      return `<span class="px-2 py-0.5 rounded text-xs bg-slate-800 text-slate-300 border border-slate-700 mono">Intent: ${score}/100</span>`;
    }

    function platformBadge(plat) {
      if (plat === 'X') return `<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-sky-500/15 text-sky-300 border border-sky-500/30 mono">𝕏 Post/Reply</span>`;
      return `<span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-orange-500/15 text-orange-300 border border-orange-500/30 mono">Y HackerNews</span>`;
    }

    function renderCard(r, isIndented = false) {
      const signals = (r.intent_signals || '').split('|').filter(Boolean);
      const kws = (r.keywords_matched || '').split(',').filter(Boolean);
      return `
        <div class="glass rounded-xl p-4 space-y-2.5 transition hover:border-slate-600 ${isIndented ? 'ml-6 sm:ml-10 border-l-4 border-l-sky-500/60 bg-slate-900/60' : ''}">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              ${platformBadge(r.platform)}
              <span class="px-2 py-0.5 rounded text-[10px] uppercase mono ${r.item_type === 'post' ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-slate-800 text-slate-300'}">
                ${r.item_type === 'post' ? 'ROOT POST' : '↳ NESTED COMMENT'}
              </span>
              <span class="text-xs font-semibold text-white mono">${r.author_handle}</span>
              <span class="text-[11px] text-slate-400 mono">id: ${r.post_id}</span>
              ${r.parent_id ? `<span class="text-[11px] text-sky-400 mono">parent: ${r.parent_id}</span>` : ''}
            </div>
            <div class="flex items-center gap-2">
              ${intentBadge(r.buyer_intent_score)}
              <a href="${r.url}" target="_blank" rel="noopener" class="text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-sky-300 mono">Open Live ↗</a>
            </div>
          </div>

          <p class="text-sm text-slate-100 leading-relaxed">${r.text}</p>

          <div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-[11px] text-slate-400 mono">
            <div class="flex flex-wrap items-center gap-1.5">
              ${signals.map(s => `<span class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-300">${s}</span>`).join('')}
              ${kws.map(k => `<span class="px-1.5 py-0.5 rounded bg-sky-950/60 border border-sky-800/50 text-sky-300">#${k}</span>`).join('')}
            </div>
            <div class="flex items-center gap-3">
              <span>⬆️ Score: ${r.engagement_score}</span>
              <span>💬 Replies: ${r.reply_count}</span>
              <span>🕒 ${r.created_at_utc}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderFeed() {
      const plat = document.getElementById('platformFilter').value;
      const typeMode = document.getElementById('typeFilter').value;
      const minIntent = parseInt(document.getElementById('intentFilter').value, 10) || 0;
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = RECORDS.filter(r => {
        if (plat !== 'ALL' && r.platform !== plat) return false;
        if (typeMode === 'post' && r.item_type !== 'post') return false;
        if (typeMode === 'comment' && r.item_type !== 'comment') return false;
        if (r.buyer_intent_score < minIntent) return false;
        if (q) {
          const hay = `${r.text} ${r.author_handle} ${r.intent_signals} ${r.keywords_matched}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      renderKPIs(filtered);
      const container = document.getElementById('recordsContainer');

      if (typeMode === 'TREE') {
        const byParent = {};
        filtered.forEach(r => {
          if (r.parent_id) {
            byParent[r.parent_id] = byParent[r.parent_id] || [];
            byParent[r.parent_id].push(r);
          }
        });
        const roots = filtered.filter(r => !r.parent_id || !filtered.some(x => x.post_id === r.parent_id));
        const renderTreeItem = (item, depth) => {
          let html = renderCard(item, depth > 0);
          const kids = byParent[item.post_id] || [];
          kids.forEach(k => { html += renderTreeItem(k, depth + 1); });
          return html;
        };
        container.innerHTML = roots.map(r => renderTreeItem(r, 0)).join('');
      } else {
        container.innerHTML = filtered.map(r => renderCard(r, r.item_type === 'comment')).join('');
      }
    }

    ['platformFilter', 'typeFilter', 'intentFilter'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderFeed);
    });
    document.getElementById('searchInput').addEventListener('input', renderFeed);

    document.getElementById('downloadJsonBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(DATASET, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'blitsum_live_sample_25plus.json';
      a.click();
    });

    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
      const cols = DATASET.schema_fields;
      const lines = [cols.join(',')];
      RECORDS.forEach(r => {
        const row = cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(',');
        lines.push(row);
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'blitsum_live_sample_25plus.csv';
      a.click();
    });

    renderFeed();
  </script>
